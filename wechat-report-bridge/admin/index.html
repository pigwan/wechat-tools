<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>微信 · 本地镜像</title>
  <script>
    /* 清掉废弃的宽度存储键。宽度失控的真正原因是 .list 缺 min-width:0，
       已在 style.css 修复；这里只防止万一加载到旧版 app.js 时又读回旧值。 */
    try {
      localStorage.removeItem("listWidth");
      localStorage.removeItem("listWidth2");
      localStorage.removeItem("listWidth3");
      localStorage.removeItem("listWidthResetV3");
    } catch (e) {}
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23131b2a'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-size='36' font-weight='700' fill='%2307c160' font-family='Arial'%3EW%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css?v=20">
</head>
<body>
  <div id="app">
    <!-- 最左深色导航栏 -->
    <aside class="rail" id="rail">
      <div class="rail-top">
        <div class="rail-avatar" id="railAvatar" title="我"></div>
        <button class="rail-btn active" data-nav="chat" title="聊天">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        </button>
        <button class="rail-btn" data-nav="contacts" title="通讯录">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </button>
        <button class="rail-btn" data-nav="moments" title="朋友圈">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
        </button>
        <button class="rail-btn" data-nav="apps" title="应用">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        </button>
      </div>
      <div class="rail-bottom">
        <button class="rail-btn" id="btnSettings" title="设置">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </aside>

    <!-- 中间列表 -->
    <section class="list" id="list">
      <div class="list-search">
        <input id="searchInput" type="search" placeholder="搜索" autocomplete="off">
      </div>
      <div class="contact-tabs hidden" id="contactTabs">
        <button data-ctab="friend" class="active">好友</button>
        <button data-ctab="group">群聊</button>
        <button data-ctab="official">公众号</button>
      </div>
      <div class="list-body" id="listBody"></div>
    </section>

    <!-- 列表宽度拖拽手柄 -->
    <div class="resizer" id="listResizer" title="拖拽调节宽度"></div>

    <!-- 右侧主区 -->
    <main class="main" id="main">
      <div class="empty-state" id="emptyState">
        <div class="empty-logo">💬</div>
        <p>选择一个会话开始查看</p>
      </div>
    </main>
  </div>

  <!-- 登录遮罩 -->
  <div id="login" class="overlay hidden">
    <div class="login-card">
      <h2>微信 · 本地镜像</h2>
      <p class="login-sub">需要登录后查看本地微信数据</p>
      <label>账号</label>
      <input id="loginUser" type="text" placeholder="账号" autocomplete="off">
      <label>密码</label>
      <input id="loginPass" type="password" placeholder="密码" autocomplete="off">
      <button id="btnLogin" class="btn primary block">登录</button>
      <p id="loginErr" class="login-err"></p>
      <p class="login-note">数据均为本机只读镜像，不会向微信发送任何请求。</p>
    </div>
  </div>

  <!-- 资料弹窗 -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <button type="button" class="mclose" id="modalClose">×</button>
      <div id="modalCard"></div>
    </div>
  </div>

  <!-- 设置弹层（左下角） -->
  <div id="settingsPanel" class="settings-panel hidden">
    <div class="settings-head">
      <span>设置</span>
      <button type="button" class="mclose" id="settingsClose">×</button>
    </div>
    <div class="settings-body" id="settingsBody"></div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="/app.js?v=20"></script>
</body>
</html>
